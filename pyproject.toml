[project]
name = "multimodal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bhamniyarvi", email = "bhamniyaravi8@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "groq>=0.37.1",
    "langchain>=1.4.3",
    "langchain-core>=1.6.6",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-pinecone>=0.2.13",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pinecone>=7.3.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "tabulate>=0.10.0",
]

[project.scripts]
multimodal = "multimodal:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
